[project]
name = "main"
version = "0.1.0"
description = "Let's Do Digital main"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "django (>=5.1.4,<6.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "tweepy (>=4.14.0,<5.0.0)",
    "selenium (>=4.27.1,<5.0.0)",
    "webdriver-manager (>=4.0.2,<5.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "fastapi (>=0.115.6,<0.116.0)",
    "linkedin-api-client (>=0.3.0,<0.4.0)",
    "instagrapi (>=2.1.3,<3.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "atproto (>=0.0.56,<0.0.57)",
    "schedule (>=1.2.2,<2.0.0)",
    "facebook-sdk (>=3.1.0,<4.0.0)",
    "mastodon-py (>=1.8.1,<2.0.0)",
    "fluent-discourse (>=1.0.1,<2.0.0)",
    "flask (>=3.1.0,<4.0.0)",
    "pytz (>=2024.2,<2025.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "undetected-chromedriver (>=3.5.5,<4.0.0)",
    "fake-useragent (>=2.0.3,<3.0.0)",
    "pychrome (>=0.2.4,<0.3.0)",
    "playwright (>=1.49.1,<2.0.0)",
    "ruff (>=0.9.2,<0.10.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "blueskysocial (>=1.7.0,<2.0.0)",
    "pyzmq (>=26.2.0,<27.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "comms" }
]